<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Lille - Valmorel</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* 5 niveaux de texte : label 12, texte 14, bouton 14 (600), titre de section 18, titre de page 30 */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,"Helvetica Neue",sans-serif;
  --bg:#f2f2f7;--card:#ffffff;--label:#000;--label2:rgba(60,60,67,.66);--label3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.14);
  --bleu:#007AFF;--vert:#34C759;--orange:#FF9500;--rouge:#FF3B30;--noir:#1c1c1e;
  --ombre:0 1px 2px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.06);--fill:rgba(120,120,128,.12);
  --txtvert:#1f8a3b;--txtorange:#b25000;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--card:#1c1c1e;--label:#fff;--label2:rgba(235,235,245,.62);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.6);
  --bleu:#0A84FF;--vert:#30D158;--orange:#FF9F0A;--rouge:#FF453A;--noir:#f2f2f7;
  --ombre:none;--fill:rgba(120,120,128,.24);--txtvert:#30D158;--txtorange:#FF9F0A;}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--label);font:400 14px/1.4 var(--font);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;gap:16px;padding:20px 24px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex:none}
h1{font-size:30px;font-weight:700;letter-spacing:-.4px;margin:0;line-height:1.1}
.sub{color:var(--label2);margin-top:4px}
.total{display:flex;gap:32px;text-align:right;white-space:nowrap}
.total b{display:block;font-size:30px;font-weight:700;letter-spacing:-.4px;line-height:1.1;font-variant-numeric:tabular-nums}
.total span{font-size:12px;color:var(--label2)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(380px,1.5fr) minmax(0,1fr) minmax(0,1fr);gap:16px}
/* carte : grand panneau gauche, plein cadre */
.carte{position:relative;border-radius:22px;overflow:hidden;box-shadow:var(--ombre);background:var(--card);min-height:0}
#map{position:absolute;inset:0}
.verre{position:absolute;left:12px;right:12px;bottom:12px;border-radius:16px;padding:12px 14px;background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);box-shadow:0 0 0 .5px var(--sep),0 8px 24px rgba(0,0,0,.18);z-index:500;display:grid;gap:6px}
.verre .ln{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.verre .k{font-size:12px;color:var(--label2)}
.verre b{font-weight:600}
.leg-ln{display:flex;gap:14px;font-size:12px;color:var(--label2);flex-wrap:wrap}
.leg-ln i{display:inline-block;width:18px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--bleu)}
.leg-ln i.r{background:none;height:0;border-top:3px dotted var(--noir)}
/* colonnes */
.col{display:flex;flex-direction:column;min-height:0;gap:10px}
.col>h2{font-size:18px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px;flex:none}
.col>h2 i{width:10px;height:10px;border-radius:50%;background:var(--bleu)}
.col.ret>h2 i{background:var(--noir)}
.liste{overflow:auto;display:flex;flex-direction:column;gap:10px;padding:3px 3px 8px;min-height:0}
.liste::-webkit-scrollbar{width:0}
.opt{flex:none;background:var(--card);border-radius:18px;box-shadow:var(--ombre);border:2px solid transparent;overflow:hidden}
.opt.on{border-color:var(--bleu)}
.ret .opt.on{border-color:var(--noir)}
.head{padding:12px 16px;cursor:pointer;user-select:none;display:grid;gap:3px}
.r1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mode{font-weight:600}
.prix{font-size:18px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.hrs{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.hrs i{flex:1;height:3px;border-radius:2px;background:var(--fill)}
.hrs b{font-weight:600}
.meta{color:var(--label2);font-size:12px}
.best{color:var(--txtvert);font-weight:600;font-size:12px}
.warn{color:var(--txtorange);font-size:12px}
.detail{display:none;border-top:.5px solid var(--sep);padding:4px 16px 12px}
.opt.open .detail{display:block}
.leg{display:grid;grid-template-columns:42px 1fr auto;gap:2px 10px;padding:9px 0;border-bottom:.5px solid var(--sep)}
.leg:last-of-type{border-bottom:0}
.leg .t{font-weight:600;font-variant-numeric:tabular-nums}
.leg .dir{color:var(--label2);font-size:12px;display:block}
.leg .pp{text-align:right;font-weight:600;white-space:nowrap}
.leg .pp small{display:block;font-weight:400;color:var(--label2);font-size:12px;white-space:normal;max-width:150px;margin-left:auto}
.leg a{grid-column:2 / 4;justify-self:start;font-weight:600;color:var(--bleu);text-decoration:none}
.sum{padding-top:8px;border-top:.5px solid var(--sep)}
/* pied : réductions et notes */
footer{flex:none;display:grid;grid-template-columns:repeat(3,1fr) auto;gap:20px;align-items:center;background:var(--card);border-radius:18px;box-shadow:var(--ombre);padding:12px 18px}
footer b{display:block;font-weight:600}
footer small{display:block;color:var(--label2);font-size:12px}
.chg{font:inherit;font-weight:600;color:var(--bleu);background:var(--fill);border:0;border-radius:10px;padding:8px 14px;cursor:pointer;white-space:nowrap}
#chg-panneau{display:none;position:fixed;right:24px;bottom:96px;width:min(520px,calc(100vw - 48px));max-height:70vh;overflow:auto;background:var(--card);border-radius:20px;padding:18px 20px;box-shadow:0 0 0 .5px var(--sep),0 20px 50px rgba(0,0,0,.28);z-index:2000}
#chg-panneau.ouvert{display:block}
#chg-panneau h3{margin:0 0 8px;font-size:18px;font-weight:700}
#chg-panneau .l{display:grid;grid-template-columns:1fr auto;gap:12px;padding:7px 0;border-bottom:.5px solid var(--sep)}
#chg-panneau .l:last-child{border-bottom:0}
#chg-panneau .v{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.haut{color:var(--rouge)}.bas{color:var(--txtvert)}
.note{grid-column:1/-1;color:var(--label2);font-size:12px;border-top:.5px solid var(--sep);padding-top:8px}
@media (max-width:1100px){body{height:auto}main{grid-template-columns:1fr 1fr}.carte{grid-column:1/-1;height:420px}footer{grid-template-columns:1fr}}
@media (max-width:700px){main{grid-template-columns:1fr}.total{gap:18px}header{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<header>
  <div><h1>Lille - Valmorel</h1><div class="sub" id="sub"></div></div>
  <div class="total"><div><b id="tot2"></b><span>pour vous 2</span></div><div><b id="totpp"></b><span>par personne</span></div></div>
</header>
<main>
  <div class="carte"><div id="map"></div>
    <div class="verre"><div class="ln"><span class="k">Aller</span><b id="rAller"></b></div><div class="ln"><span class="k">Retour</span><b id="rRetour"></b></div>
      <div class="leg-ln"><span><i></i>Aller</span><span><i class="r"></i>Retour</span></div></div></div>
  <div class="col"><h2><i></i>Aller</h2><div class="liste" id="aller"></div></div>
  <div class="col ret"><h2><i></i>Retour</h2><div class="liste" id="retour"></div></div>
</main>
<footer>
  <div id="reduc" style="display:contents"></div>
  <button class="chg" id="bChg">Changements depuis le 02/11 et notes</button>
  </footer>
<div id="chg-panneau"><h3>Depuis le 02/11, par personne</h3><div id="chg"></div><div class="note" id="note" style="margin-top:12px;border-top:.5px solid var(--sep);padding-top:10px"></div></div>

<script>
const INFO={
 sub:'Sofian et Jules, 2 personnes. Aller dim. 27 au soir ou lun. 28/12, retour sam. 02 ou dim. 03/01. Prix relevés le 18/11/2026 sur les sites des transporteurs, en 2de classe.',
 note:'Tous les prix sont pour vous 2, relevés le 18/11/2026 entre 11h et 12h : ils bougent, à revérifier en réservant. Trainline bloque les recherches automatiques : les prix train viennent de SNCF Connect et d\'OUIGO. Bus S62 : horaires et prix du site Altibus pour l\'hiver 2026-27 (aller-retour jeune 13,50 € chacun, le tarif jeune est accessible sans carte). Ticket de métro à Lyon non compté. Le car BlaBlaCar Bus de 03:00 est à vérifier avant d\'y compter : une source évoque l\'arrêt de l\'activité fin 2026, sans confirmation officielle.'
};
const REDUC=[
 {nom:'Aucun code promo valable',detail:'Testés au panier FlixBus le 18/11 : FLIXFR26 (en fait un code Bolt) et XY4 (site allemand) sont refusés. Les offres OUIGO de novembre sont terminées.'},
 {nom:'Carte Avantage Jeune (49 € chacun)',detail:'Rentable seulement avec les TGV de 05:52 et 15:14 (gain net 126 € pour 2), mais ces trajets restent bien plus chers que les bus : non retenue.'},
 {nom:'Black Friday SNCF',detail:'Rien de confirmé pour 2026, à revoir le 27/11.'}
];

/* liens */
const FBID={lille:'40deaa9f-8646-11e6-9066-549f350fcb0c',paris:'40de8964-8646-11e6-9066-549f350fcb0c',lyon:'40df89c1-8646-11e6-9066-549f350fcb0c',moutiers:'40e02a44-8646-11e6-9066-549f350fcb0c'};
const fb=(f,t,d)=>['Réserver sur FlixBus',`https://shop.flixbus.fr/search?departureCity=${FBID[f]}&arrivalCity=${FBID[t]}&rideDate=${d}&adult=2&_locale=fr`];
const kb=(d,f,t,fi,ti)=>['Réserver sur Kombo (BlaBlaCar Bus)',`https://www.kombo.co/fr/app/outward/2/${fi}/${ti}/${d}/${f}/${t}/0/0/results`];
const SNCF=['Réserver sur SNCF Connect','https://www.sncf-connect.com/app/home/search'];
const OUIGO_PM=['Réserver sur OUIGO','https://ventes.ouigo.com/fr-FR/orientation/deep-edito/?target=routes&origin=87686006&destination=87741728&outboundDate=2026-12-28&passengers%5B0%5D%5Btype%5D=A&passengers%5B1%5D%5Btype%5D=A'];
const OUIGO=['Réserver sur OUIGO','https://www.ouigo.com/'];
const ALTI=['Réserver le bus S62 (Altibus)','https://booking-one.altibus.com/'];

/* étapes réutilisées : n = prix pour 2 */
const S62A=dep=>({t:dep,lieu:'Moûtiers, gare routière',what:'Bus S62',dir:'jusqu\'à Valmorel, arrêt Crève Cœur (40 min)'+(dep==='18:30'?' ; réservation obligatoire':''),n:13.5,cn:'moitié de l\'aller-retour jeune (27 € pour 2)',link:ALTI});
const S62R=dep=>({t:dep,lieu:'Valmorel',what:'Bus S62',dir:'jusqu\'à Moûtiers gare (40 min)',n:13.5,cn:'moitié de l\'aller-retour jeune (27 € pour 2)',link:ALTI});
const M14A={t:'',lieu:'Paris Bercy',what:'Métro 14',dir:'jusqu\'à Gare de Lyon (2 arrêts)',n:5.1};
const M14R={t:'',lieu:'Paris Gare de Lyon',what:'Métro 14',dir:'jusqu\'à Cour Saint-Émilion, puis 5 min à pied jusqu\'à Bercy',n:5.1};
const RERA={t:'',lieu:'Paris Gare du Nord',what:'RER D',dir:'jusqu\'à Gare de Lyon (1 arrêt)',n:5.1};
const METROB={t:'',lieu:'Lyon Gerland',what:'Métro B',dir:'jusqu\'à Part-Dieu (15 min)',n:0,cn:'ticket TCL non compté'};

const ALLER=[
 {m:'FlixBus de nuit + TER',jour:'dim. 27 au soir',dep:'21:55',arr:'12:10',d:'14h15',route:['lille','lyon','chambery','moutiers'],
  legs:[{t:'21:55',lieu:'Lille Europe',what:'FlixBus',dir:'direct jusqu\'à Lyon Gerland, arrivée lun. 28 à 06:50',n:114.98,link:fb('lille','lyon','27.12.2026')},
   METROB,
   {t:'08:08',lieu:'Lyon Part-Dieu',what:'TER',dir:'1 changement, arrivée à Moûtiers 11:10',n:50,link:SNCF},S62A('11:30')]},
 {m:'FlixBus de nuit + TER (plus tôt)',jour:'dim. 27 au soir',dep:'19:50',arr:'12:10',d:'16h20',route:['lille','lyon','chambery','moutiers'],
  legs:[{t:'19:50',lieu:'Lille Europe',what:'FlixBus',dir:'direct jusqu\'à Lyon Gerland, arrivée lun. 28 à 04:50',n:134.98,link:fb('lille','lyon','27.12.2026')},
   METROB,
   {t:'06:20',lieu:'Lyon Part-Dieu',what:'TER',dir:'1 changement, arrivée à Moûtiers 09:48',n:45.2,link:SNCF},S62A('11:30')]},
 {m:'BlaBlaCar Bus + TER',jour:'lun. 28',dep:'03:00',arr:'19:10',d:'16h10',route:['lille','paris','lyon','chambery','moutiers'],warn:'Bus S62 de 18:30 sur réservation ; car à vérifier',
  legs:[{t:'03:00',lieu:'Lille Europe',what:'BlaBlaCar Bus',dir:'changement à Paris Bercy, arrivée à Lyon Gerland 13:40',n:92.96,cn:'sur Kombo, ajoute un adulte et ouvre l\'onglet Bus',link:kb('2026-12-28','Lille','Lyon',11,18)},
   METROB,
   {t:'14:50',lieu:'Lyon Part-Dieu',what:'TER',dir:'changement à Chambéry, arrivée à Moûtiers 18:10',n:45.2,link:SNCF},S62A('18:30')]},
 {m:'FlixBus + OUIGO + TER',jour:'lun. 28',dep:'08:10',arr:'19:10',d:'11h00',route:['lille','paris','lyon','chambery','moutiers'],warn:'Bus S62 de 18:30 sur réservation',
  legs:[{t:'08:10',lieu:'Lille Europe',what:'FlixBus',dir:'direct jusqu\'à Paris Bercy, arrivée 11:15',n:32.98,link:fb('lille','paris','28.12.2026')},M14A,
   {t:'12:30',lieu:'Paris Gare de Lyon',what:'OUIGO',dir:'direct jusqu\'à Lyon Part-Dieu, arrivée 14:30',n:110,link:OUIGO},
   {t:'14:50',lieu:'Lyon Part-Dieu',what:'TER',dir:'changement à Chambéry, arrivée à Moûtiers 18:10',n:45.2,link:SNCF},S62A('18:30')]},
 {m:'FlixBus + OUIGO direct',jour:'lun. 28',dep:'06:40',arr:'16:40',d:'10h00',route:['lille','paris','moutiers'],
  legs:[{t:'06:40',lieu:'Lille Europe',what:'FlixBus',dir:'direct jusqu\'à Paris Bercy, arrivée 09:50',n:30.98,link:fb('lille','paris','28.12.2026')},M14A,
   {t:'10:42',lieu:'Paris Gare de Lyon',what:'OUIGO',dir:'direct jusqu\'à Moûtiers, arrivée 15:40',n:178,link:OUIGO_PM},S62A('16:00')]},
 {m:'TGV + OUIGO',jour:'lun. 28',dep:'08:12',arr:'16:40',d:'8h28',route:['lille','paris','moutiers'],
  legs:[{t:'08:12',lieu:'Lille Flandres',what:'TGV INOUI puis OUIGO',dir:'TGV jusqu\'à Paris Gare du Nord (09:14), RER D, puis OUIGO direct jusqu\'à Moûtiers (15:40)',n:260,link:SNCF},RERA,S62A('16:00')]},
 {m:'TGV via Paris',jour:'lun. 28',dep:'05:52',arr:'14:10',d:'8h18',route:['lille','paris','moutiers'],
  legs:[{t:'05:52',lieu:'Lille Flandres',what:'TGV INOUI puis TGV INOUI',dir:'changement à Paris (RER D), arrivée à Moûtiers 12:48',n:348,link:SNCF},RERA,S62A('13:30')]}
];
const RETOUR=[
 {m:'Bus + bus, nuit à Lyon',jour:'sam. 02/01',dep:'17:55',arr:'18:15',d:'24h20',route:['moutiers','lyon','lille'],warn:'Nuit à la gare routière de Lyon, arrivée dim. 03/01',
  legs:[S62R('17:55'),{t:'22:35',lieu:'Moûtiers, gare routière',what:'FlixBus',dir:'direct jusqu\'à Lyon Gerland, arrivée 00:55',n:42.98,link:fb('moutiers','lyon','02.01.2027')},
   {t:'08:30',lieu:'Lyon Gerland',what:'BlaBlaCar Bus',dir:'direct jusqu\'à Lille Europe, arrivée dim. 03/01 à 18:15',n:82.98,cn:'sur Kombo, ajoute un adulte et ouvre l\'onglet Bus',link:kb('2027-01-03','Lyon','Lille',18,11)}]},
 {m:'FlixBus direct de nuit',jour:'dim. 03/01',dep:'17:00',arr:'09:55',d:'17h',route:['moutiers','lille'],warn:'5 h d\'attente à Moûtiers, arrivée lun. 04/01',
  legs:[S62R('17:00'),{t:'22:35',lieu:'Moûtiers, gare routière',what:'FlixBus',dir:'direct jusqu\'à Lille Europe, arrivée lun. 04/01 à 09:55',n:130.98,link:fb('moutiers','lille','03.01.2027')}]},
 {m:'FlixBus avec changement',jour:'sam. 02/01',dep:'17:55',arr:'11:05',d:'17h10',route:['moutiers','lille'],warn:'Arrivée dim. 03/01 à 11:05',
  legs:[S62R('17:55'),{t:'22:35',lieu:'Moûtiers, gare routière',what:'FlixBus',dir:'1 changement, arrivée à Lille Europe dim. 03/01 à 11:05',n:212.96,link:fb('moutiers','lille','02.01.2027')}]},
 {m:'OUIGO + FlixBus de nuit',jour:'dim. 03/01',dep:'17:00',arr:'06:30',d:'13h30',route:['moutiers','paris','lille'],warn:'Nuit à Paris Bercy, arrivée lun. 04/01',
  legs:[S62R('17:00'),{t:'18:11',lieu:'Moûtiers gare',what:'OUIGO',dir:'direct jusqu\'à Paris Gare de Lyon, arrivée 22:56',n:198,link:OUIGO},M14R,
   {t:'03:25',lieu:'Paris Bercy',what:'FlixBus',dir:'direct jusqu\'à Lille Europe, arrivée lun. 04/01 à 06:30',n:21.98,link:fb('paris','lille','04.01.2027')}]},
 {m:'TER + TGV via Lyon',jour:'dim. 03/01',dep:'14:05',arr:'21:58',d:'7h53',route:['moutiers','lyon','lille'],
  legs:[S62R('14:05'),{t:'15:14',lieu:'Moûtiers gare',what:'TER puis TGV INOUI',dir:'changement à Lyon Part-Dieu, arrivée à Lille Europe 21:58',n:319.2,link:SNCF}]}
];

/* ce qui a bougé depuis le relevé du 02/11, par personne (avant, après) */
const CHANGES=[
 {t:'TGV direct Moûtiers, Lille du sam. 02/01 (16:23)',v:'plus de place en 2de classe',dir:'haut'},
 {t:'FlixBus de nuit Lille, Lyon 19:50',v:'55,99 € à 67,49 €',dir:'haut'},
 {t:'FlixBus de nuit Lille, Lyon 21:55',v:'62,99 € à 57,49 €',dir:'bas'},
 {t:'OUIGO Paris, Lyon 12:30',v:'39 € à 55 €',dir:'haut'},
 {t:'OUIGO Paris, Moûtiers 28/12',v:'85 € à 89 €',dir:'haut'},
 {t:'OUIGO Moûtiers, Paris dim. 03/01',v:'89 € à 99 €',dir:'haut'},
 {t:'FlixBus Moûtiers, Lille sam. 02/01 (direct)',v:'84,32 € à 146,49 €',dir:'haut'},
 {t:'TGV 08:12 + OUIGO Lille, Moûtiers',v:'119 € à 130 €',dir:'haut'},
 {t:'BlaBlaCar Bus Lyon, Lille 08:30',v:'42,99 € à 41,49 €',dir:'bas'},
 {t:'TER Lyon, Moûtiers (tarif promo)',v:'inchangé, 22,60 €',dir:''},
 {t:'Bus S62, aller-retour jeune',v:'inchangé, 13,50 €',dir:''}
];

const eur=n=>{n=Math.round(n*100)/100;return n.toLocaleString('fr-FR',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})+' €';};
const cost=o=>o.legs.reduce((s,l)=>s+(l.n||0),0);
[...ALLER,...RETOUR].forEach(o=>o.k=cost(o));
ALLER.sort((a,b)=>a.k-b.k); RETOUR.sort((a,b)=>a.k-b.k);
let sa=0, sr=Math.max(0,RETOUR.findIndex(o=>o.jour==='dim. 03/01')), open=null;
document.getElementById('sub').textContent=INFO.sub;
document.getElementById('note').textContent=INFO.note;
document.getElementById('chg').innerHTML=CHANGES.map(c=>`<div class="l"><span>${c.t}</span><span class="v ${c.dir}">${c.v}</span></div>`).join('');
document.getElementById('bChg').onclick=()=>document.getElementById('chg-panneau').classList.toggle('ouvert');
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('chg-panneau').classList.remove('ouvert')});
document.getElementById('reduc').innerHTML=REDUC.map(x=>`<div><b>${x.nom}</b><small>${x.detail}</small></div>`).join('');

function legHtml(l){
  const p=l.n==null?'<small>inclus</small>':l.n===0?'<small>'+(l.cn||'')+'</small>':eur(l.n)+(l.cn?`<small>${l.cn}</small>`:'');
  return `<div class="leg"><span class="t">${l.t||''}</span><span><b>${l.what}</b> · ${l.lieu}<span class="dir">${l.dir}</span></span><span class="pp">${p}</span>${l.link?`<a href="${l.link[1]}" target="_blank" rel="noopener">${l.link[0]}</a>`:''}</div>`;
}
function card(o,i,ret){
  const sel=(ret?sr:sa)===i, isOpen=open===(ret?'r':'a')+i, k=o.k;
  return `<div class="opt${sel?' on':''}${isOpen?' open':''}">
   <div class="head" data-i="${i}" data-r="${ret?1:0}">
    <div class="r1"><span class="mode">${o.m}</span><span class="prix">${eur(k)}</span></div>
    <div class="hrs"><b>${o.dep}</b><i></i><b>${o.arr}</b></div>
    <div class="meta">${o.jour} · ${o.d} · ${eur(k/2)} par personne</div>
    ${i===0?'<div class="best">Le moins cher</div>':''}${o.warn?`<div class="warn">${o.warn}</div>`:''}
   </div>
   <div class="detail">${o.legs.map(legHtml).join('')}<div class="sum">Pour 2 : <b>${eur(k)}</b>, soit ${eur(k/2)} chacun</div></div></div>`;
}
function render(){
  document.getElementById('aller').innerHTML=ALLER.map((o,i)=>card(o,i,false)).join('');
  document.getElementById('retour').innerHTML=RETOUR.map((o,i)=>card(o,i,true)).join('');
  const a=ALLER[sa], r=RETOUR[sr], t=a.k+r.k;
  document.getElementById('tot2').textContent=eur(t);
  document.getElementById('totpp').textContent=eur(t/2);
  document.getElementById('rAller').textContent=`${a.m} · ${a.dep} à ${a.arr}`;
  document.getElementById('rRetour').textContent=`${r.m} · ${r.dep} à ${r.arr}`;
  draw(a,r);
}
document.addEventListener('click',e=>{if(e.target.closest('a')||e.target.closest('.chg'))return; const h=e.target.closest('.head'); if(!h)return; const i=+h.dataset.i, ret=h.dataset.r==='1', key=(ret?'r':'a')+i;
  if(ret)sr=i; else sa=i; open=open===key?null:key; render();});

/* ---------- carte grand format, centrée sur l'itinéraire ---------- */
const P={lille:[50.6366,3.0705],paris:[48.8443,2.3744],lyon:[45.7606,4.8593],chambery:[45.5714,5.9195],moutiers:[45.4851,6.5315],valmorel:[45.4614,6.4436]};
const NOMS={lille:'Lille',paris:'Paris',lyon:'Lyon',chambery:'Chambéry',moutiers:'Moûtiers',valmorel:'Valmorel'};
const map=L.map('map',{scrollWheelZoom:true,zoomControl:true,attributionControl:true});
const dark=matchMedia('(prefers-color-scheme: dark)').matches;
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/'+(dark?'World_Dark_Gray_Base':'World_Light_Gray_Base')+'/MapServer/tile/{z}/{y}/{x}',{maxZoom:12,attribution:'Tiles &copy; Esri'}).addTo(map);
const layer=L.layerGroup().addTo(map);
const ETIQ=['lille','paris','lyon','valmorel'];
function pin(k){
  if(!ETIQ.includes(k)) return L.circleMarker(P[k],{radius:6,color:'#1c1c1e',weight:3,fillColor:'#fff',fillOpacity:1});
  return L.marker(P[k],{icon:L.divIcon({className:'',html:`<div style="display:flex;align-items:center;gap:6px;${k==='lyon'?'flex-direction:row-reverse;transform:translate(calc(-100% + 8px),-8px)':'transform:translate(-8px,-8px)'}"><span style="width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid #1c1c1e;box-shadow:0 1px 4px rgba(0,0,0,.4);flex:none"></span><span style="font:600 14px -apple-system,system-ui,sans-serif;color:#1c1c1e;background:rgba(255,255,255,.95);padding:3px 9px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.25);white-space:nowrap">${NOMS[k]}</span></div>`,iconSize:[0,0]})});
}
function draw(a,r){
  layer.clearLayers(); const css=getComputedStyle(document.documentElement);
  const bleu=css.getPropertyValue('--bleu').trim();
  const ra=[...a.route,'valmorel'].map(k=>P[k]), rr=['valmorel',...r.route].map(k=>P[k]);
  L.polyline(ra,{color:'#fff',weight:10,opacity:.9}).addTo(layer); L.polyline(ra,{color:bleu,weight:6}).addTo(layer);
  L.polyline(rr,{color:'#fff',weight:9,opacity:.9}).addTo(layer); L.polyline(rr,{color:'#1c1c1e',weight:5,dashArray:'2 10',lineCap:'round'}).addTo(layer);
  new Set([...a.route,...r.route,'valmorel']).forEach(k=>pin(k).addTo(layer));
  map.fitBounds(L.latLngBounds(Object.values(P)),{paddingTopLeft:[40,40],paddingBottomRight:[40,110]});
}
render();
new ResizeObserver(()=>{map.invalidateSize();draw(ALLER[sa],RETOUR[sr])}).observe(document.querySelector('.carte'));
</script>
