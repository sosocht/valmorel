<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lille - Valmorel</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 5 niveaux : label 12, bouton 14 (500), texte 14, titre de section 18, titre de page 30 */
:root{--bg:#f4f5f7;--card:#fff;--ink:#111;--mute:#6b7280;--line:#e5e7eb;--soft:#f3f4f6;--sel:#1D9BF0;--ok:#008000;--warn:#c2410c;--ret:#111}
@media (prefers-color-scheme:dark){:root{--bg:#0e1013;--card:#181b20;--ink:#f3f4f6;--mute:#9ca3af;--line:#2a2f36;--soft:#21252b;--warn:#fb923c;--ret:#f3f4f6}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;display:flex;flex-direction:column;gap:14px;padding:16px 20px}
header{display:flex;align-items:center;justify-content:space-between;gap:24px;flex:none}
h1{font-size:30px;font-weight:600;margin:0}
.sub{color:var(--mute);margin-top:2px}
.total{display:flex;gap:28px;align-items:baseline;text-align:right}
.total b{font-size:30px;font-weight:600;display:block;line-height:1.1}
.total span{font-size:12px;color:var(--mute)}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr);gap:16px}
.col{display:flex;flex-direction:column;min-height:0;gap:10px}
.col>h2{font-size:18px;font-weight:600;margin:0;display:flex;align-items:center;gap:8px;flex:none}
.col>h2 i{width:10px;height:10px;border-radius:50%;background:var(--sel)}
.ret>h2 i{background:var(--ret)}
.liste{overflow:auto;display:flex;flex-direction:column;gap:10px;padding:3px 3px 12px;min-height:0}
.liste::-webkit-scrollbar{width:6px}.liste::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.opt{flex:none;background:var(--card);border:2px solid var(--line);border-radius:20px;overflow:hidden}
.opt.on{border-color:var(--sel)}
.ret .opt.on{border-color:var(--ret)}
.head{padding:12px 16px;cursor:pointer;user-select:none;display:grid;gap:4px}
.r1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mode{font-weight:600}
.prix{font-size:18px;font-weight:600;white-space:nowrap}
.hrs{display:flex;align-items:center;gap:10px}
.hrs i{flex:1;height:2px;background:var(--line)}
.hrs b{font-weight:600}
.meta{color:var(--mute);font-size:12px}
.best{color:var(--ok);font-weight:600;font-size:12px}
.warn{color:var(--warn);font-size:12px}
.detail{display:none;border-top:1px solid var(--line);background:var(--soft);padding:6px 16px 12px}
.opt.open .detail{display:block}
.leg{display:grid;grid-template-columns:44px 1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.leg:last-of-type{border-bottom:0}
.leg .t{font-weight:600}
.leg .dir{color:var(--mute);font-size:12px;display:block}
.leg .pp{text-align:right;font-weight:600;white-space:nowrap}
.leg .pp small{display:block;font-weight:400;color:var(--mute);font-size:12px;white-space:normal;max-width:150px;margin-left:auto}
.leg a{grid-column:2 / 4;justify-self:start;font-weight:500;color:var(--sel);text-decoration:none}
.sum{padding-top:8px;border-top:1px solid var(--line)}
.side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.box h3{margin:0 0 8px;font-size:18px;font-weight:600}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:44px 14px 1fr;gap:8px;padding:3px 0}
.steps .t{font-weight:600;text-align:right}
.steps .b{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--sel)}
.steps .b.r{background:var(--ret)}
.steps small{display:block;color:var(--mute);font-size:12px}
.steps .sep{display:block;border-top:1px solid var(--line);margin:6px 0}
.reducs{flex:none;display:grid;grid-template-columns:110px 1fr;gap:8px 12px;align-items:center;padding:10px 16px}.reducs h3{margin:0}.reduc{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.reduc div b{font-weight:600}
.reduc small{display:block;color:var(--mute);font-size:12px}
#map{flex:1;min-height:150px;border-radius:20px;overflow:hidden}
.note{color:var(--mute);font-size:12px}
.bar{display:none}
@media (max-width:1100px){.reducs{grid-template-columns:1fr}.reduc{grid-template-columns:1fr}body{height:auto}.grid{grid-template-columns:1fr 1fr}.side{grid-column:1 / 3}}
@media (max-width:700px){
 header{flex-direction:column;align-items:flex-start}
 .grid{grid-template-columns:1fr}.side{grid-column:auto}
 .bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--ink);color:var(--bg);padding:12px 16px;justify-content:space-between;align-items:center;gap:10px}
 .bar b{font-size:18px;font-weight:600}
 .bar span{font-size:12px;opacity:.75;display:block}
 .bar a{color:var(--bg);font-weight:500;text-decoration:none}
}
</style>
</head>
<body>
<header>
  <div><h1>Lille - Valmorel</h1><div class="sub" id="sub"></div></div>
  <div class="total"><div><b id="tot2"></b><span>pour vous 2, tout compris</span></div><div><b id="totpp"></b><span>par personne</span></div></div>
</header>
<div class="grid">
  <div class="col"><h2><i></i>Aller</h2><div class="liste" id="aller"></div></div>
  <div class="col ret"><h2><i></i>Retour</h2><div class="liste" id="retour"></div></div>
  <div class="side" id="trajet">
    <div class="box"><h3>Ton trajet</h3><ul class="steps" id="steps"></ul></div>
    <div id="map"></div>
      </div>
</div>
<footer class="box reducs"><h3>Réductions</h3><div class="reduc" id="reduc"></div><div class="note" id="note" style="grid-column:1/3"></div></footer>
<div class="bar"><div><b id="mtot"></b><span id="mpp"></span></div><a href="#trajet">Voir le trajet</a></div>

<script>
const INFO={
 sub:'Sofian et Jules, 2 personnes. Aller dim. 27 au soir ou lun. 28/12, retour sam. 02 ou dim. 03/01. Prix relevés le 18/11/2026 sur les sites des transporteurs, en 2de classe.',
 note:'Tous les prix sont pour vous 2, relevés le 18/11/2026 entre 11h et 12h : ils bougent, à revérifier en réservant. Trainline bloque les recherches automatiques : les prix train viennent de SNCF Connect et d\'OUIGO. Bus S62 : horaires et prix du site Altibus pour l\'hiver 2026-27 (aller-retour jeune 13,50 € chacun, le tarif jeune est accessible sans carte). Ticket de métro à Lyon non compté. Le car BlaBlaCar Bus de 03:00 est à vérifier avant d\'y compter : une source évoque l\'arrêt de l\'activité fin 2026, sans confirmation officielle.'
};
const REDUC=[
 {nom:'Aucun code promo valable',detail:'Testés au panier FlixBus le 18/11 : FLIXFR26 (en fait un code Bolt) et XY4 (site allemand) sont refusés. Les offres OUIGO de novembre sont terminées.'},
 {nom:'Carte Avantage Jeune (49 € chacun)',detail:'Rentable seulement avec les TGV de 05:52 et 15:14 (gain net 126 € pour 2), mais ces trajets restent bien plus chers que les bus : non retenue.'},
 {nom:'Black Friday SNCF',detail:'Rien de confirmé pour 2026, à revoir le 27/11.'}
];

/* liens */
const FBID={lille:'40deaa9f-8646-11e6-9066-549f350fcb0c',paris:'40de8964-8646-11e6-9066-549f350fcb0c',lyon:'40df89c1-8646-11e6-9066-549f350fcb0c',moutiers:'40e02a44-8646-11e6-9066-549f350fcb0c'};
const fb=(f,t,d)=>['Réserver sur FlixBus',`https://shop.flixbus.fr/search?departureCity=${FBID[f]}&arrivalCity=${FBID[t]}&rideDate=${d}&adult=2&_locale=fr`];
const kb=(d,f,t,fi,ti)=>['Réserver sur Kombo (BlaBlaCar Bus)',`https://www.kombo.co/fr/app/outward/2/${fi}/${ti}/${d}/${f}/${t}/0/0/results`];
const SNCF=['Réserver sur SNCF Connect','https://www.sncf-connect.com/app/home/search'];
const OUIGO_PM=['Réserver sur OUIGO','https://ventes.ouigo.com/fr-FR/orientation/deep-edito/?target=routes&origin=87686006&destination=87741728&outboundDate=2026-12-28&passengers%5B0%5D%5Btype%5D=A&passengers%5B1%5D%5Btype%5D=A'];
const OUIGO=['Réserver sur OUIGO','https://www.ouigo.com/'];
const ALTI=['Réserver le bus S62 (Altibus)','https://booking-one.altibus.com/'];

/* étapes réutilisées : n = prix pour 2 */
const S62A=dep=>({t:dep,lieu:'Moûtiers, gare routière',what:'Bus S62',dir:'jusqu\'à Valmorel, arrêt Crève Cœur (40 min)'+(dep==='18:30'?' ; réservation obligatoire':''),n:13.5,cn:'moitié de l\'aller-retour jeune (27 € pour 2)',link:ALTI});
const S62R=dep=>({t:dep,lieu:'Valmorel',what:'Bus S62',dir:'jusqu\'à Moûtiers gare (40 min)',n:13.5,cn:'moitié de l\'aller-retour jeune (27 € pour 2)',link:ALTI});
const M14A={t:'',lieu:'Paris Bercy',what:'Métro 14',dir:'jusqu\'à Gare de Lyon (2 arrêts)',n:5.1};
const M14R={t:'',lieu:'Paris Gare de Lyon',what:'Métro 14',dir:'jusqu\'à Cour Saint-Émilion, puis 5 min à pied jusqu\'à Bercy',n:5.1};
const RERA={t:'',lieu:'Paris Gare du Nord',what:'RER D',dir:'jusqu\'à Gare de Lyon (1 arrêt)',n:5.1};
const METROB={t:'',lieu:'Lyon Gerland',what:'Métro B',dir:'jusqu\'à Part-Dieu (15 min)',n:0,cn:'ticket TCL non compté'};

const ALLER=[
 {m:'FlixBus de nuit + TER',jour:'dim. 27 au soir',dep:'21:55',arr:'12:10',d:'14h15',route:['lille','lyon','chambery','moutiers'],
  legs:[{t:'21:55',lieu:'Lille Europe',what:'FlixBus',dir:'direct jusqu\'à Lyon Gerland, arrivée lun. 28 à 06:50',n:114.98,link:fb('lille','lyon','27.12.2026')},
   METROB,
   {t:'08:08',lieu:'Lyon Part-Dieu',what:'TER',dir:'1 changement, arrivée à Moûtiers 11:10',n:50,link:SNCF},S62A('11:30')]},
 {m:'FlixBus de nuit + TER (plus tôt)',jour:'dim. 27 au soir',dep:'19:50',arr:'12:10',d:'16h20',route:['lille','lyon','chambery','moutiers'],
  legs:[{t:'19:50',lieu:'Lille Europe',what:'FlixBus',dir:'direct jusqu\'à Lyon Gerland, arrivée lun. 28 à 04:50',n:134.98,link:fb('lille','lyon','27.12.2026')},
   METROB,
   {t:'06:20',lieu:'Lyon Part-Dieu',what:'TER',dir:'1 changement, arrivée à Moûtiers 09:48',n:45.2,link:SNCF},S62A('11:30')]},
 {m:'BlaBlaCar Bus + TER',jour:'lun. 28',dep:'03:00',arr:'19:10',d:'16h10',route:['lille','paris','lyon','chambery','moutiers'],warn:'Bus S62 de 18:30 sur réservation ; car à vérifier',
  legs:[{t:'03:00',lieu:'Lille Europe',what:'BlaBlaCar Bus',dir:'changement à Paris Bercy, arrivée à Lyon Gerland 13:40',n:92.96,cn:'sur Kombo, ajoute un adulte et ouvre l\'onglet Bus',link:kb('2026-12-28','Lille','Lyon',11,18)},
   METROB,
   {t:'14:50',lieu:'Lyon Part-Dieu',what:'TER',dir:'changement à Chambéry, arrivée à Moûtiers 18:10',n:45.2,link:SNCF},S62A('18:30')]},
 {m:'FlixBus + OUIGO + TER',jour:'lun. 28',dep:'08:10',arr:'19:10',d:'11h00',route:['lille','paris','lyon','chambery','moutiers'],warn:'Bus S62 de 18:30 sur réservation',
  legs:[{t:'08:10',lieu:'Lille Europe',what:'FlixBus',dir:'direct jusqu\'à Paris Bercy, arrivée 11:15',n:32.98,link:fb('lille','paris','28.12.2026')},M14A,
   {t:'12:30',lieu:'Paris Gare de Lyon',what:'OUIGO',dir:'direct jusqu\'à Lyon Part-Dieu, arrivée 14:30',n:110,link:OUIGO},
   {t:'14:50',lieu:'Lyon Part-Dieu',what:'TER',dir:'changement à Chambéry, arrivée à Moûtiers 18:10',n:45.2,link:SNCF},S62A('18:30')]},
 {m:'FlixBus + OUIGO direct',jour:'lun. 28',dep:'06:40',arr:'16:40',d:'10h00',route:['lille','paris','moutiers'],
  legs:[{t:'06:40',lieu:'Lille Europe',what:'FlixBus',dir:'direct jusqu\'à Paris Bercy, arrivée 09:50',n:30.98,link:fb('lille','paris','28.12.2026')},M14A,
   {t:'10:42',lieu:'Paris Gare de Lyon',what:'OUIGO',dir:'direct jusqu\'à Moûtiers, arrivée 15:40',n:178,link:OUIGO_PM},S62A('16:00')]},
 {m:'TGV + OUIGO',jour:'lun. 28',dep:'08:12',arr:'16:40',d:'8h28',route:['lille','paris','moutiers'],
  legs:[{t:'08:12',lieu:'Lille Flandres',what:'TGV INOUI puis OUIGO',dir:'TGV jusqu\'à Paris Gare du Nord (09:14), RER D, puis OUIGO direct jusqu\'à Moûtiers (15:40)',n:260,link:SNCF},RERA,S62A('16:00')]},
 {m:'TGV via Paris',jour:'lun. 28',dep:'05:52',arr:'14:10',d:'8h18',route:['lille','paris','moutiers'],
  legs:[{t:'05:52',lieu:'Lille Flandres',what:'TGV INOUI puis TGV INOUI',dir:'changement à Paris (RER D), arrivée à Moûtiers 12:48',n:348,link:SNCF},RERA,S62A('13:30')]}
];
const RETOUR=[
 {m:'Bus + bus, nuit à Lyon',jour:'sam. 02/01',dep:'17:55',arr:'18:15',d:'24h20',route:['moutiers','lyon','lille'],warn:'Nuit à la gare routière de Lyon, arrivée dim. 03/01',
  legs:[S62R('17:55'),{t:'22:35',lieu:'Moûtiers, gare routière',what:'FlixBus',dir:'direct jusqu\'à Lyon Gerland, arrivée 00:55',n:42.98,link:fb('moutiers','lyon','02.01.2027')},
   {t:'08:30',lieu:'Lyon Gerland',what:'BlaBlaCar Bus',dir:'direct jusqu\'à Lille Europe, arrivée dim. 03/01 à 18:15',n:82.98,cn:'sur Kombo, ajoute un adulte et ouvre l\'onglet Bus',link:kb('2027-01-03','Lyon','Lille',18,11)}]},
 {m:'FlixBus direct de nuit',jour:'dim. 03/01',dep:'17:00',arr:'09:55',d:'17h',route:['moutiers','lille'],warn:'5 h d\'attente à Moûtiers, arrivée lun. 04/01',
  legs:[S62R('17:00'),{t:'22:35',lieu:'Moûtiers, gare routière',what:'FlixBus',dir:'direct jusqu\'à Lille Europe, arrivée lun. 04/01 à 09:55',n:130.98,link:fb('moutiers','lille','03.01.2027')}]},
 {m:'FlixBus avec changement',jour:'sam. 02/01',dep:'17:55',arr:'11:05',d:'17h10',route:['moutiers','lille'],warn:'Arrivée dim. 03/01 à 11:05',
  legs:[S62R('17:55'),{t:'22:35',lieu:'Moûtiers, gare routière',what:'FlixBus',dir:'1 changement, arrivée à Lille Europe dim. 03/01 à 11:05',n:212.96,link:fb('moutiers','lille','02.01.2027')}]},
 {m:'OUIGO + FlixBus de nuit',jour:'dim. 03/01',dep:'17:00',arr:'06:30',d:'13h30',route:['moutiers','paris','lille'],warn:'Nuit à Paris Bercy, arrivée lun. 04/01',
  legs:[S62R('17:00'),{t:'18:11',lieu:'Moûtiers gare',what:'OUIGO',dir:'direct jusqu\'à Paris Gare de Lyon, arrivée 22:56',n:198,link:OUIGO},M14R,
   {t:'03:25',lieu:'Paris Bercy',what:'FlixBus',dir:'direct jusqu\'à Lille Europe, arrivée lun. 04/01 à 06:30',n:21.98,link:fb('paris','lille','04.01.2027')}]},
 {m:'TER + TGV via Lyon',jour:'dim. 03/01',dep:'14:05',arr:'21:58',d:'7h53',route:['moutiers','lyon','lille'],
  legs:[S62R('14:05'),{t:'15:14',lieu:'Moûtiers gare',what:'TER puis TGV INOUI',dir:'changement à Lyon Part-Dieu, arrivée à Lille Europe 21:58',n:319.2,link:SNCF}]}
];

/* ---------- calculs : tout est pour 2 personnes (Sofian et Jules), prix p = par personne ---------- */
const eur=n=>{n=Math.round(n*100)/100;return n.toLocaleString('fr-FR',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})+' €';};
const cost=o=>o.legs.reduce((s,l)=>s+(l.n||0),0);
[...ALLER,...RETOUR].forEach(o=>o.k=cost(o));
ALLER.sort((a,b)=>a.k-b.k); RETOUR.sort((a,b)=>a.k-b.k);
let sa=0, sr=Math.max(0,RETOUR.findIndex(o=>o.jour==='dim. 03/01')), open=null;
document.getElementById('sub').textContent=INFO.sub;
document.getElementById('note').textContent=INFO.note;

function legHtml(l){
  const p=l.n==null?'<small>inclus</small>':l.n===0?'<small>'+(l.cn||'')+'</small>':eur(l.n)+(l.cn?`<small>${l.cn}</small>`:'');
  return `<div class="leg"><span class="t">${l.t||''}</span><span><b>${l.what}</b> · ${l.lieu}<span class="dir">${l.dir}</span></span><span class="pp">${p}</span>${l.link?`<a href="${l.link[1]}" target="_blank" rel="noopener">${l.link[0]}</a>`:''}</div>`;
}
function card(o,i,ret){
  const sel=(ret?sr:sa)===i, isOpen=open===(ret?'r':'a')+i, k=o.k;
  return `<div class="opt${sel?' on':''}${isOpen?' open':''}">
   <div class="head" data-i="${i}" data-r="${ret?1:0}">
    <div class="r1"><span class="mode">${o.m}</span><span class="prix">${eur(k)}</span></div>
    <div class="hrs"><b>${o.dep}</b><i></i><b>${o.arr}</b></div>
    <div class="meta">${o.jour} · ${o.d} · ${eur(k/2)} par personne</div>
    ${i===0?'<div class="best">Le moins cher</div>':''}${o.warn?`<div class="warn">${o.warn}</div>`:''}
   </div>
   <div class="detail">${o.legs.map(legHtml).join('')}<div class="sum">Pour 2 : <b>${eur(k)}</b>, soit ${eur(k/2)} chacun</div></div></div>`;
}
function render(){
  document.getElementById('aller').innerHTML=ALLER.map((o,i)=>card(o,i,false)).join('');
  document.getElementById('retour').innerHTML=RETOUR.map((o,i)=>card(o,i,true)).join('');
  const a=ALLER[sa], r=RETOUR[sr], t=a.k+r.k;
  ['tot2','mtot'].forEach(id=>document.getElementById(id).textContent=eur(t));
  document.getElementById('totpp').textContent=eur(t/2);
  document.getElementById('mpp').textContent=`pour 2 · ${eur(t/2)} chacun`;
  const li=(l,cls)=>`<li><span class="t">${l.t||''}</span><span class="b ${cls}"></span><span>${l.what} · ${l.lieu}<small>${l.dir}</small></span></li>`;
  document.getElementById('steps').innerHTML=`<li><span class="t"></span><span></span><span class="meta">Aller ${a.jour}</span></li>`+a.legs.map(l=>li(l,'')).join('')
   +`<li><span class="t">${a.arr}</span><span class="b"></span><span>Valmorel, le chalet</span></li>`
   +`<li><span class="sep" style="grid-column:1/4"></span></li><li><span class="t"></span><span></span><span class="meta">Retour ${r.jour}</span></li>`
   +r.legs.map(l=>li(l,'r')).join('');
  document.getElementById('reduc').innerHTML=REDUC.length?REDUC.map(x=>`<div><b>${x.nom}</b><small>${x.detail}</small></div>`).join(''):'<small>Aucune réduction vérifiée pour ces trajets.</small>';
  draw(a,r);
}
document.addEventListener('click',e=>{if(e.target.closest('a'))return; const h=e.target.closest('.head'); if(!h)return; const i=+h.dataset.i, ret=h.dataset.r==='1', key=(ret?'r':'a')+i;
  if(ret)sr=i; else sa=i; open=open===key?null:key; render();});

/* ---------- carte ---------- */
const P={lille:[50.6366,3.0705],paris:[48.8443,2.3744],lyon:[45.7606,4.8593],chambery:[45.5714,5.9195],moutiers:[45.4851,6.5315],valmorel:[45.4614,6.4436]};
const NOMS={lille:'Lille',paris:'Paris',lyon:'Lyon',chambery:'Chambéry',moutiers:'Moûtiers',valmorel:'Valmorel'};
const map=L.map('map',{scrollWheelZoom:false,zoomControl:false,dragging:!L.Browser.mobile,tap:false});
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,attribution:'Tiles &copy; Esri'}).addTo(map);
const layer=L.layerGroup().addTo(map);
function draw(a,r){
  layer.clearLayers(); const css=getComputedStyle(document.documentElement);
  L.polyline([...a.route,'valmorel'].map(k=>P[k]),{color:css.getPropertyValue('--sel').trim(),weight:5}).addTo(layer);
  L.polyline(['valmorel',...r.route].map(k=>P[k]),{color:'#111',weight:4,dashArray:'8 8'}).addTo(layer);
  new Set([...a.route,...r.route,'valmorel']).forEach(k=>L.circleMarker(P[k],{radius:5,color:'#111',weight:2,fillColor:'#fff',fillOpacity:1}).bindTooltip(NOMS[k],{permanent:['lille','paris','lyon','valmorel'].includes(k),direction:k==='lyon'?'left':'right'}).addTo(layer));
  map.fitBounds(L.latLngBounds(Object.values(P)),{padding:[20,20]});
}
render();
</script>
</body>
</html>
